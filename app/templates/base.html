<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Regensburg Digital Museum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        /* --- Global Theme Variables --- */
        :root {
            --bg-dark: #0f1012;       
            --bg-card: #1c1c1f;       
            --text-main: #e2e2e2;     
            --text-muted: #a1a1aa;    
            --accent: #d4af37;        /* Museum Gold */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            /* Subtle gradient background */
            background-image: radial-gradient(circle at 50% 0%, #2a2a35 0%, var(--bg-dark) 80%);
            overflow-x: hidden; /* Prevent horizontal scroll */
        }

        /* Typography - Serif for Headings */
        h1, h2, h3, h4, h5, h6, .brand {
            font-family: 'Playfair Display', serif;
            color: #ffffff !important;
            letter-spacing: 0.01em;
        }

        p, li, span, div { color: var(--text-main); }
        .text-muted { color: var(--text-muted) !important; }
        .text-accent { color: var(--accent) !important; }

        /* Glassmorphism Card Style */
        .card {
            background: rgba(28, 28, 31, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
        }

        /* Navbar Styling */
        .site-header {
            background: rgba(15, 16, 18, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .brand div:first-child {
            background: var(--accent) !important;
            color: #000 !important;
        }
        
        nav a { color: var(--text-muted) !important; transition: 0.3s; font-size: 0.95rem; }
        nav a:hover { color: var(--accent) !important; }

        /* Forms & Buttons */
        input, textarea, select {
            background-color: rgba(0,0,0,0.3) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: #fff !important;
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus { border-color: var(--accent) !important; outline: none; }
        
        button, .btn {
             border-radius: 50px;
             font-weight: 500;
             transition: all 0.3s;
        }
    </style>
</head>
<body>
    <header class="site-header sticky top-0 z-50">
        <div class="container max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 brand hover:opacity-90 transition">
                <div class="w-10 h-10 rounded-lg grid place-items-center text-xl font-bold shadow-lg shadow-yellow-900/20">RM</div>
                <div>
                    <div class="text-lg font-bold leading-none">Regensburg</div>
                    <div class="text-[10px] uppercase tracking-widest text-accent opacity-90">Caltural Hub</div>
                </div>
            </a>
            
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="/">Gallery</a>
                <a href="/museum">The Building</a>
                <a href="/events">Workshops</a>
                <a href="/cafe">Rooftop Café</a>
                <a href="/partners">Partners</a>
                <a href="/scan" class="px-5 py-2 bg-gradient-to-r from-accent to-yellow-700 text-black rounded-full font-bold hover:scale-105 transition shadow-lg shadow-yellow-900/30 border-none">Scan QR</a>
            </nav>
        </div>
    </header>

    <main class="min-h-[80vh]">
        {% block content %}{% endblock %}
    </main>

    <footer class="mt-20 py-10 text-center text-sm border-t border-white/5 bg-black/20">
        <div class="mb-4 flex justify-center gap-4 opacity-50">
            <a href="#" class="hover:text-accent">Privacy</a>
            <a href="#" class="hover:text-accent">Terms</a>
            <a href="/about" class="hover:text-accent">Vision</a>
        </div>
        <p class="opacity-40">© 2025 Regensburg Caltural Hub</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 800,
        once: true,
        offset: 50
      });
    </script>
</body>
</html>
