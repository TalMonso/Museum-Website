<!doctype html>
<html lang="en">
<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta name="description" content="Regensburg Digital Museum — explore artworks with QR scanning or from home">
        <title>Regensburg Digital Museum</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/css/style.css">
        <style>body{font-family:'Rubik', system-ui, sans-serif; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}</style>
</head>
<body class="bg-white text-gray-900">
        <header class="site-header bg-white border-b">
            <div class="container max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
                <a href="/" class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gray-100 rounded-lg grid place-items-center text-xl font-bold">RM</div>
                    <div class="brand">
                        <div class="text-lg font-semibold">Regensburg</div>
                        <div class="text-xs opacity-70 -mt-1">Digital Museum</div>
                    </div>
                </a>

                <div class="hidden md:flex items-center gap-6">
                    <nav class="flex gap-4 text-sm text-gray-700">
                        <a href="/about" class="hover:underline">About</a>
                        <a href="/scan" class="hover:underline">Scan</a>
                        <a href="/" class="hover:underline">Explore</a>
                    </nav>
                    <form action="/search" method="get" class="relative">
                        <input name="q" placeholder="Search artworks" class="px-3 py-2 rounded-lg border w-64 text-sm" />
                    </form>
                </div>

                <div class="md:hidden">
                    <button id="menu-toggle" aria-label="Toggle menu" class="p-2 rounded-md border">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>

            <div id="mobile-menu" class="md:hidden hidden border-t">
                <div class="px-4 py-3">
                    <a href="/about" class="block py-2">About</a>
                    <a href="/scan" class="block py-2">Scan</a>
                    <a href="/" class="block py-2">Explore</a>
                    <form action="/search" method="get" class="mt-2">
                        <input name="q" placeholder="Search artworks" class="px-3 py-2 rounded-lg border w-full text-sm" />
                    </form>
                </div>
            </div>
        </header>

        <main class="min-h-[60vh]">
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer bg-gray-50 border-t mt-12">
            <div class="container max-w-6xl mx-auto px-4 py-8 grid md:grid-cols-3 gap-4">
                <div>
                    <div class="font-semibold">Regensburg Digital Museum</div>
                    <div class="text-sm opacity-70">A small demo project showcasing museum artifacts and QR-driven experiences.</div>
                </div>
                <div class="text-sm opacity-80">
                    <div class="font-medium mb-2">Links</div>
                    <a href="/about" class="block py-1">About</a>
                    <a href="/scan" class="block py-1">Scan</a>
                </div>
                <div class="text-sm opacity-80">
                    <div class="font-medium mb-2">Contact</div>
                    <div class="py-1">demo@example.org</div>
                    <div class="py-1">© Demo project</div>
                </div>
            </div>
        </footer>

        <script>
            // Mobile menu toggle
            document.addEventListener('DOMContentLoaded', function(){
                const btn = document.getElementById('menu-toggle');
                const menu = document.getElementById('mobile-menu');
                if(!btn) return;
                btn.addEventListener('click', function(){
                    menu.classList.toggle('hidden');
                });
            });
        </script>
</body>
</html>
