{% extends 'base.html' %}
{% block content %}

{% if '/static' in original_img %}
    <input type="hidden" id="baseImageSrc" value="{{ original_img }}">
{% else %}
    <input type="hidden" id="baseImageSrc" value="/static/{{ original_img }}">
{% endif %}

<section class="container max-w-5xl mx-auto p-6">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold mb-2">Curate the Artwork</h1>
        <p class="text-gray-400">Apply professional lighting and atmospheric filters to re-imagine the masterpiece.</p>
    </div>

    <div class="grid lg:grid-cols-[2fr,1fr] gap-8 items-start">

        <div class="card p-4 flex justify-center items-center bg-black/50 backdrop-blur-xl rounded-2xl border border-white/10 shadow-2xl">
            <canvas id="editorCanvas" class="max-w-full h-auto rounded-xl shadow-lg transition-all duration-500 ease-in-out"></canvas>
        </div>

        <div class="flex flex-col gap-6">
            
            <div class="card p-5">
                <div class="flex items-center justify-between mb-4">
                     <h3 class="text-lg font-bold text-accent">Atmospheric Filters</h3>
                     <button onclick="applyFilter('none')" class="text-xs text-gray-400 hover:text-white transition">Reset Original</button>
                </div>
               
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="applyFilter('none')" class="filter-btn group p-2 rounded-xl border border-white/10 hover:border-accent hover:bg-white/5 transition text-left">
                        <div class="h-8 w-full bg-gray-800 rounded-md mb-2 group-hover:opacity-80 transition"></div>
                        <span class="text-sm font-medium">Original</span>
                    </button>

                    <button onclick="applyFilter('noir')" class="filter-btn group p-2 rounded-xl border border-white/10 hover:border-accent hover:bg-white/5 transition text-left">
                        <div class="h-8 w-full bg-gradient-to-r from-black to-gray-500 rounded-md mb-2 opacity-80"></div>
                        <span class="text-sm font-medium">Noir B&W</span>
                    </button>
                    
                    <button onclick="applyFilter('vintage')" class="filter-btn group p-2 rounded-xl border border-white/10 hover:border-accent hover:bg-white/5 transition text-left">
                        <div class="h-8 w-full bg-gradient-to-r from-orange-900/50 to-yellow-900/50 rounded-md mb-2 opacity-80"></div>
                        <span class="text-sm font-medium">Vintage Sepia</span>
                    </button>

                    <button onclick="applyFilter('drama')" class="filter-btn group p-2 rounded-xl border border-white/10 hover:border-accent hover:bg-white/5 transition text-left">
                        <div class="h-8 w-full bg-gradient-to-tr from-red-900/60 to-gray-900 rounded-md mb-2 opacity-80"></div>
                        <span class="text-sm font-medium">Dramatic Warm</span>
                    </button>

                    <button onclick="applyFilter('cinematic')" class="filter-btn group p-2 rounded-xl border border-white/10 hover:border-accent hover:bg-white/5 transition text-left">
                        <div class="h-8 w-full bg-gradient-to-r from-blue-900/50 to-teal-900/50 rounded-md mb-2 opacity-80"></div>
                        <span class="text-sm font-medium">Cinematic Cool</span>
                    </button>

                    <button onclick="applyFilter('cyber')" class="filter-btn group p-2 rounded-xl border border-white/10 hover:border-accent hover:bg-white/5 transition text-left">
                        <div class="h-8 w-full bg-gradient-to-r from-purple-900/60 to-pink-900/60 rounded-md mb-2 opacity-80"></div>
                        <span class="text-sm font-medium">Neon / Cyber</span>
                    </button>
                    
                    <button onclick="applyFilter('matte')" class="filter-btn group p-2 rounded-xl border border-white/10 hover:border-accent hover:bg-white/5 transition text-left">
                        <div class="h-8 w-full bg-gray-700/50 rounded-md mb-2 opacity-80"></div>
                        <span class="text-sm font-medium">Faded Matte</span>
                    </button>

                     <button onclick="applyFilter('vivid')" class="filter-btn group p-2 rounded-xl border border-white/10 hover:border-accent hover:bg-white/5 transition text-left">
                         <div class="h-8 w-full bg-gradient-to-r from-gray-900 to-white rounded-md mb-2 opacity-80"></div>
                        <span class="text-sm font-medium">Vivid Contrast</span>
                    </button>

                </div>
            </div>

            <div class="mt-auto">
                <button onclick="downloadCanvas()" class="w-full py-4 rounded-full bg-gradient-to-r from-accent to-yellow-600 text-black font-bold text-lg hover:scale-105 transition shadow-lg flex items-center justify-center gap-3">
                    <span>💾</span> Save Masterpiece
                </button>
            </div>
        </div>
    </div>

</section>

<script src="/static/js/canvas_editor.js"></script>

<style>
    .filter-btn.active {
        border-color: var(--accent);
        background-color: rgba(212, 175, 55, 0.1);
    }
</style>

{% endblock %}
