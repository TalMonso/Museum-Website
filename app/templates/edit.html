{% extends 'base.html' %}
{% block content %}

<section class="max-w-6xl mx-auto p-6 grid lg:grid-cols-2 gap-8">

    <!-- Original Image -->
    <div>
        <h2 class="text-2xl font-bold mb-3">Original Artwork</h2>
        <img src="/static/{{ original_img }}" class="rounded-2xl border w-full">
    </div>

    <!-- Form + Result -->
    <div>
        <h2 class="text-2xl font-bold mb-3">Edit the Artwork</h2>

        <form action="/artifact/{{ slug }}/edit" method="post" class="mb-6">
            <textarea name="prompt" placeholder="Describe the edit..."
                      class="w-full h-32 p-3 border rounded-xl"></textarea>
            <button class="mt-3 px-4 py-2 rounded-xl bg-black text-white">
                Generate
            </button>
        </form>

        {% if result_img %}
        <h3 class="text-xl font-semibold mb-2">Generated Version</h3>
        <img src="{{ result_img }}" class="rounded-2xl border mb-4 w-full"/>

        <a href="{{ result_img }}" download>
            <button class="px-4 py-2 rounded-xl border">Download</button>
        </a>
        {% endif %}
    </div>

</section>

{% endblock %}
